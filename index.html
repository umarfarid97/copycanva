<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nafisya &amp; Umar — Majlis Walimatulurus</title>
  <meta name="description" content="MAJLIS WALIMATULURUS — Nafisya &amp; Umar. 2 Januari 2027, Sabtu.">

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Italiana&family=Pinyon+Script&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #120e0b;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .video-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #120e0b;
      transition: opacity 0.6s ease;
    }

    .video-wrapper.fade-out {
      opacity: 0;
    }

    .intro-video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      background-color: #120e0b;
    }

    /* Top Overlay Controls */
    .overlay-controls {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      pointer-events: none;
    }

    .ctrl-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.84rem;
      font-weight: 500;
      padding: 8px 18px;
      background: rgba(247, 231, 205, 0.92);
      color: #6f3f01;
      border: 1px solid rgba(189, 133, 98, 0.4);
      border-radius: 50px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .ctrl-btn:hover {
      background: #f7e7cd;
      color: #bd8562;
      transform: translateY(-1px);
    }

    .ctrl-btn.skip-btn {
      background: #bd8562;
      color: #f7e7cd;
      border-color: #bd8562;
      font-weight: 600;
    }

    .ctrl-btn.skip-btn:hover {
      background: #a56f4d;
      color: #fff6e6;
    }

    /* Fallback start prompt */
    .play-fallback {
      position: absolute;
      z-index: 101;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .btn-play-invite {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      padding: 14px 44px;
      background-color: #bd8562;
      color: #f7e7cd;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      transition: all 0.25s ease;
    }

    .btn-play-invite:hover {
      background-color: #a56f4d;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="video-wrapper" id="videoWrapper">
    <video id="introVideo" class="intro-video" playsinline preload="auto" muted autoplay>
      <source src="assets/media/intro.mp4" type="video/mp4">
      Pelayar anda tidak menyokong tag video.
    </video>

    <!-- Top Controls: Sound Toggle (Left) & Skip Link (Right) -->
    <div class="overlay-controls">
      <button id="unmuteBtn" class="ctrl-btn" type="button" aria-label="Buka Bunyi" title="Buka Bunyi">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <span id="soundLabel">Buka Bunyi</span>
      </button>

      <a href="main.html" id="skipBtn" class="ctrl-btn skip-btn" aria-label="Langkau ke Laman Utama">
        <span>Langkau</span> &rarr;
      </a>
    </div>

    <!-- Fallback if browser policy blocks autoplay -->
    <div id="playFallback" class="play-fallback" style="display: none;">
      <button id="startPlayBtn" class="btn-play-invite" type="button">Buka Jemputan</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const videoWrapper = document.getElementById('videoWrapper');
      const introVideo = document.getElementById('introVideo');
      const unmuteBtn = document.getElementById('unmuteBtn');
      const soundLabel = document.getElementById('soundLabel');
      const skipBtn = document.getElementById('skipBtn');
      const playFallback = document.getElementById('playFallback');
      const startPlayBtn = document.getElementById('startPlayBtn');

      let navigated = false;
      const goToMainPage = () => {
        if (navigated) return;
        navigated = true;
        videoWrapper.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = 'main.html';
        }, 500);
      };

      // 1. When video finishes playing, automatically navigate to main page
      introVideo.addEventListener('ended', goToMainPage);

      // 2. Skip button click
      if (skipBtn) {
        skipBtn.addEventListener('click', (e) => {
          e.preventDefault();
          goToMainPage();
        });
      }

      // 3. Unmute / Mute toggle
      if (unmuteBtn) {
        unmuteBtn.addEventListener('click', () => {
          if (introVideo.muted) {
            introVideo.muted = false;
            if (soundLabel) soundLabel.textContent = 'Matikan Bunyi';
          } else {
            introVideo.muted = true;
            if (soundLabel) soundLabel.textContent = 'Buka Bunyi';
          }
        });
      }

      // 4. Autoplay handling
      const playPromise = introVideo.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Autoplay was prevented by browser policy, show manual start button
          if (playFallback) playFallback.style.display = 'flex';
        });
      }

      if (startPlayBtn) {
        startPlayBtn.addEventListener('click', () => {
          introVideo.play();
          if (playFallback) playFallback.style.display = 'none';
        });
      }
    });
  </script>
</body>
</html>
